services:
  express:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    # `expose`, nunca `ports`: o Express não tem razão para existir na internet.
    expose:
      - "3001"
    env_file: [.env.vps]
    restart: unless-stopped

  pipeline:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.pipeline
    expose:
      - "8000"
    env_file: [.env.vps]
    environment:
      # Nome do serviço na rede do compose — substitui o 127.0.0.1 local.
      EXPRESS_INTERNAL_URL: http://express:3001
    depends_on:
      - express
    # Um caso pode levar duas chamadas ao modelo (até 180 s cada) e as novas
    # tentativas do e-mail. O uvicorn espera as BackgroundTasks ao receber o
    # SIGTERM, mas o Docker manda SIGKILL depois de 10 s: sem isto, um rebuild
    # ou um restart deixa o caso em andamento preso em `generating`.
    stop_grace_period: 7m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    # Só a variável que o Caddyfile lê (`{$PIPELINE_DOMAIN}`): pelo env_file, o
    # processo exposto à internet receberia todos os segredos do .env.vps. Vem
    # por interpolação, que o compose lê sozinho de um arquivo chamado `.env` na
    # pasta do projeto: no VPS, `deploy/.env` com só `PIPELINE_DOMAIN=…`.
    # `:-` e não `:?`: o compose interpola o arquivo inteiro, e o modo local
    # (sem caddy) não tem a variável. Sem o `deploy/.env`, o domínio chega vazio
    # e o Caddy recusa o Caddyfile ("unrecognized global option") — não sobe,
    # em vez de servir sem TLS.
    environment:
      PIPELINE_DOMAIN: ${PIPELINE_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pipeline
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
