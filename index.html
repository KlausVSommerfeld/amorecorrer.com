<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sem ele o `env(safe-area-inset-bottom)` da barra de
         CTA e das ações do formulário devolve 0, e a barra fica sob o indicador
         de home dos aparelhos com notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Decide o tema ANTES da primeira pintura. O next-themes só aplica a
         classe num efeito do React: sem este bloco, quem usa o sistema no
         escuro veria a página clara durante o carregamento. A chave é a mesma
         que o next-themes usa. -->
    <script>
      (function () {
        try {
          var escolhido = localStorage.getItem('theme');
          var escuro =
            escolhido === 'dark' ||
            ((!escolhido || escolhido === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage bloqueado: fica o tema claro. */
        }
      })();
    </script>

    <title>Amo Recorrer - Recurso de Multa em Minutos</title>
    <meta
      name="description"
      content="Defesa da autuação ou recurso à JARI, redigidos por IA a partir do seu caso e da legislação do CTB. PDF A4 no e-mail, pronto para protocolar. Pagamento único, sem cadastro."
    />
    <meta name="author" content="Amo Recorrer" />
    <meta name="keywords" content="recurso multa, defesa trânsito, multa CTB, recurso automatico, IA jurídica" />
    <link rel="canonical" href="https://amorecorrer.com/" />

    <!-- A barra do navegador acompanha o tema. -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09100E" media="(prefers-color-scheme: dark)" />

    <meta property="og:site_name" content="Amo Recorrer" />
    <meta property="og:title" content="Amo Recorrer - Recurso de Multa em Minutos" />
    <meta
      property="og:description"
      content="Defesa da autuação ou recurso à JARI, redigidos por IA a partir do seu caso. PDF A4 no e-mail, pronto para protocolar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://amorecorrer.com/" />
    <!-- 1200x630: o favicon de 64px que estava aqui era descartado pelo
         WhatsApp e pelo Facebook, que pedem no mínimo 300x157 para o card
         grande declarado logo abaixo. -->
    <meta property="og:image" content="https://amorecorrer.com/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Uma notificação de autuação em papel creme, coberta pela primeira página da defesa e por um carimbo de protocolado, ao lado da frase Sua multa tem resposta."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://amorecorrer.com/og-cover.png" />

    <link rel="icon" href="/favicon-v2.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon-v2-64.png" sizes="64x64" type="image/png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
